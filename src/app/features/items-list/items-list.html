<div class="items-list-container">
  <div class="items-list-header">
    <h2>Поради дня:</h2>
    <a routerLink="/add-item" class="btn-add">
      <span>+</span> Додати пораду
    </a>
  </div>

  <div class="search-container">
    <input 
      type="text" 
      placeholder="Пошук за назвою або описом..."
      [(ngModel)]="query"
      (input)="onQueryChange()"
      class="search-input"
    />
  </div>

  <div class="items-grid">
    <app-item-card 
      *ngFor="let item of filtered$ | async; trackBy: trackById"
      [item]="item">
    </app-item-card>
  </div>
</div>
