<div class="item-details-container">
  <div class="item-detail-wrapper" *ngIf="item$ | async as item">
    <h1 class="item-detail-title">{{ item.title }}</h1>

    <div class="item-detail-content">
      <img
        [src]="item.imageUrl"
        [alt]="item.title"
        class="item-detail-img"
      />

      <div class="item-detail-text">
        <p class="item-detail-desc">{{ item.description }}</p>

        <div class="item-detail-actions">
          <a routerLink="/" class="btn-back">← Назад</a>
          <a [routerLink]="['/edit-item', item.id]" class="btn-edit">
            Редагувати
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
